<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Connecting to Google Drive...</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f0f0f1; }
        .card { background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; max-width: 400px; }
        .spinner { width: 40px; height: 40px; border: 4px solid #ddd; border-top-color: #2271b1; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status { font-size: 16px; color: #50575e; }
        .error { color: #d63638; }
        .success { color: #00a32a; }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner" id="spinner"></div>
        <div class="status" id="status">Connecting to Google Drive, please wait...</div>
    </div>
    <script>
    (function() {
        var params = new URLSearchParams(window.location.search);
        var code = params.get('code');
        var state = params.get('state');
        var error = params.get('error');
        var statusEl = document.getElementById('status');
        var spinnerEl = document.getElementById('spinner');

        function showError(msg) {
            spinnerEl.style.display = 'none';
            statusEl.className = 'status error';
            statusEl.textContent = msg;
        }

        if (error) {
            showError('Google authorization failed: ' + error);
            return;
        }

        if (!code || !state) {
            showError('Missing authorization parameters. Please try again from the plugin settings.');
            return;
        }

        // Exchange the authorization code via WordPress AJAX
        var ajaxUrl = window.location.origin + '/wp-admin/admin-ajax.php';
        var formData = new FormData();
        formData.append('action', 'gdtp_oauth_exchange');
        formData.append('code', code);
        formData.append('state', state);

        fetch(ajaxUrl, {
            method: 'POST',
            body: formData,
            credentials: 'same-origin'
        })
        .then(function(response) { return response.json(); })
        .then(function(data) {
            if (data.success) {
                spinnerEl.style.display = 'none';
                statusEl.className = 'status success';
                statusEl.textContent = 'Connected to Google Drive! Redirecting...';
                setTimeout(function() {
                    window.location.href = data.data.redirect;
                }, 500);
            } else {
                showError('Error: ' + (data.data && data.data.message ? data.data.message : 'Unknown error. Please try again.'));
            }
        })
        .catch(function(err) {
            showError('Connection error: ' + err.message + '. Please try again.');
        });
    })();
    </script>
</body>
</html>
